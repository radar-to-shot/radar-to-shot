name: WebAssembly site

on:
  push:
    paths:
      - 'include/**'
      - 'src/**'
      - 'third_party/**'
      - 'web/**'
      - 'docs/**'
      - 'robots/**'
      - 'tools/build_site.py'
      - 'tools/requirements-web.txt'
      - 'tests/validate_wasm.mjs'
      - 'tests/test_browser.py'
      - 'tests/golden/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'third_party/**'
      - 'web/**'
      - 'docs/**'
      - 'robots/**'
      - 'tools/build_site.py'
      - 'tools/requirements-web.txt'
      - 'tests/validate_wasm.mjs'
      - 'tests/test_browser.py'
      - 'tests/golden/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this tested ref to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wasm-site-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-web.txt
      - name: Install pinned Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
          actions-cache-folder: emsdk-cache
          cache-key: emsdk-4.0.15-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare test reports
        run: mkdir -p build/web-checks
      - name: Install site and browser test dependencies
        run: python -m pip install -r tools/requirements-web.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Configure WebAssembly build
        run: |
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            2>&1 | tee build/web-checks/configure.log
      - name: Build WebAssembly engine
        run: cmake --build build-wasm --parallel 2 2>&1 | tee build/web-checks/build.log
      - name: Build static site
        run: |
          python tools/build_site.py --wasm-dir build-wasm --output build/site \
            2>&1 | tee build/web-checks/site.log
      - name: Validate WebAssembly against original golden outputs
        run: |
          node tests/validate_wasm.mjs --module build/site/wasm/robotwar.js \
            2>&1 | tee build/web-checks/wasm-validation.log
      - name: Test the site in Chromium
        run: |
          python tests/test_browser.py --site-dir build/site \
            2>&1 | tee build/web-checks/browser.log
      - name: Upload preview site
        if: >-
          ${{ !((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages site
        if: >-
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/web-checks/
            build/browser/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4
