name: C++ formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install -r tools/requirements-format.txt
      - name: Check project C++ formatting
        run: python tools/format_cpp.py --check
