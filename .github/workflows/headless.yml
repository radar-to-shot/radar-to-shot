name: Headless compatibility
on:
  push:
    paths: ['include/**', 'src/**', 'tests/**', 'tools/**', 'scripts/**', 'robots/examples/**', 'images/Mac_IIci.ROM', 'reverse/original/**', 'CMakeLists.txt', '.github/workflows/headless.yml']
  pull_request:
    paths: ['include/**', 'src/**', 'tests/**', 'tools/**', 'scripts/**', 'robots/examples/**', 'images/Mac_IIci.ROM', 'reverse/original/**', 'CMakeLists.txt', '.github/workflows/headless.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DROBOTWAR_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  original-battles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python tools/build_patched_emulator.py
      - run: python tests/test_battle_runners.py --binary build/robotwar --emulator
        env:
          PYTHONPATH: ${{ github.workspace }}/work/machine68k-patched
